[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "geoquickview"
version = "0.2.0"
description = "Offline desktop quick-look viewer for geospatial rasters, NetCDF and vectors"
readme = "README.md"
requires-python = ">=3.12"
license = {text = "MIT"}
dependencies = ["numpy", "GDAL>=3.8", "PySide6>=6.6", "pyqtgraph>=0.13", "xarray>=2025.1", "h5netcdf", "h5py", "scipy", "cftime", "matplotlib", "cartopy", "pyproj"]

[project.gui-scripts]
geoquickview = "geoquickview.__main__:main"

[tool.setuptools.packages.find]
include = ["geoquickview*"]

[tool.setuptools.package-data]
geoquickview = ["assets/*"]
