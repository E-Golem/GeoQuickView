name: geoquickview
channels:
  - conda-forge
dependencies:
  - python=3.12
  - numpy
  - libblas=*=*openblas
  - libcblas=*=*openblas
  - liblapack=*=*openblas
  - gdal>=3.8
  - libgdal-netcdf
  - libgdal-hdf5
  - pyside6>=6.6
  - pyqtgraph>=0.13
  - xarray>=2025.1
  - h5netcdf
  - h5py
  - scipy
  - cftime
  - matplotlib
  - cartopy
  - pyproj
  - pyinstaller
  - pip
